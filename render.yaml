services:
  - type: web
    name: doccaller
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_HOST
        value: 0.0.0.0
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_PARSER_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: SHEET_ID
        sync: false
      - key: SHEET_TAB
        value: Leads
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: JOBS_ENABLED
        value: "true"
